# Local infrastructure + application containers.
#
#   docker compose up -d postgres minio minio-init      # infra only (run web/worker on the host)
#   docker compose --profile app up --build             # everything in containers
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: massefelt
      POSTGRES_PASSWORD: massefelt
      POSTGRES_DB: massefelt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massefelt"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: massefelt
      MINIO_ROOT_PASSWORD: massefelt-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 massefelt massefelt-secret &&
                  mc mb --ignore-existing local/massefelt && echo bucket ready"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://massefelt:massefelt@postgres:5432/massefelt
      STORAGE_DRIVER: s3
      S3_BUCKET: massefelt
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: massefelt
      S3_SECRET_ACCESS_KEY: massefelt-secret
      S3_FORCE_PATH_STYLE: "true"
      AUTH_MODE: dev
      # Development auth inside a production build; never enable on a public deployment.
      ALLOW_DEV_AUTH_IN_PRODUCTION: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build:
      context: apps/worker
    environment:
      DATABASE_URL: postgresql://massefelt:massefelt@postgres:5432/massefelt
      WORKER_ID: worker-docker-1
      PHOTOGRAMMETRY_ENGINE: none
    # Processing is isolated: no published ports, read-only root filesystem, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
